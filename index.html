<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<link rel="manifest" href="./manifest.webmanifest" />
<title>Darts Practice Log</title>
<style>
  :root{
    --bg:#0f1115; --panel:#181c23; --panel2:#202631; --text:#eef2f7;
    --muted:#9aa6b2; --accent:#5da9ff; --good:#55d187; --danger:#ff6b6b;
    --warning:#ffb454; --warningInk:#2a1700; --border:#303846;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
  header{padding:20px 16px 8px;max-width:1000px;margin:auto}
  h1{margin:0;font-size:25px}
  main{max-width:1000px;margin:auto;padding:12px 16px 60px}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tab{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:11px 14px;border-radius:10px;cursor:pointer}
  .tab.active{background:var(--accent);color:#07111d;border-color:var(--accent);font-weight:700}
  section{display:none;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px}
  section.active{display:block}
  h2{margin-top:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
  input,select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:11px;font-size:16px}
  .bullBox{display:grid;grid-template-columns:1fr 90px 70px;gap:8px;align-items:end}
  .bullBtn{height:48px;border:0;border-radius:10px;background:var(--good);color:#07140b;font-size:22px;font-weight:800;cursor:pointer}
  .bullMinus{height:48px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:var(--text);font-size:20px;font-weight:800;cursor:pointer}

  .rounds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .noBullToggle{border:1px solid var(--border);background:var(--panel2);color:var(--muted);padding:12px 8px;border-radius:9px;font-size:15px;font-weight:750;cursor:pointer;transition:.15s}
  .noBullToggle.active{background:var(--warning);border-color:var(--warning);color:var(--warningInk);box-shadow:0 0 0 1px var(--warning)}

  button{font:inherit}
  .primary,.secondary,.danger,.share,.iconBtn{border:0;border-radius:10px;padding:11px 14px;cursor:pointer}
  .primary{background:var(--accent);color:#07111d;font-weight:700}
  .secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
  .danger{background:#3a2023;color:#ffd7d7}
  .share{background:var(--good);color:#07140b;font-weight:800}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .actions button{min-height:44px}
  .iconActions{display:flex;gap:8px;flex-wrap:wrap}
  .iconBtn{display:grid;place-items:center;width:46px;height:46px;padding:0;background:var(--panel2);color:var(--text);border:1px solid var(--border)}
  .iconBtn.shareIcon{background:var(--good);color:#07140b;border-color:var(--good)}
  .iconBtn.dangerIcon{background:#3a2023;color:#ffd7d7;border-color:#553034}
  .iconBtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .cricketPlay{margin-top:16px}
  .roundStatus{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#111722;border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px}
  .roundNow{display:flex;align-items:baseline;gap:6px;line-height:1}
  .roundCurrent{font-size:34px;font-weight:900;color:var(--text);letter-spacing:-.02em}
  .roundMax{font-size:16px;font-weight:650;color:var(--muted)}
  .roundTarget{color:var(--muted);font-size:13px;margin-top:6px}
  .mprPanel{text-align:right;min-width:118px}
  .mprLabel{font-size:11px;color:var(--muted);font-weight:750;letter-spacing:.08em}
  .mprValue{font-size:34px;line-height:1.05;font-weight:900;color:var(--good);font-variant-numeric:tabular-nums;margin-top:2px}
  .marksMini{font-size:12px;color:var(--muted);margin-top:7px}
  .marksMini b{color:var(--text);font-size:14px}

  .currentDarts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .currentDart{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px}
  .dartTitle{text-align:center;color:var(--muted);font-size:13px;margin-bottom:8px}
  .markButtons{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
  .markButtons button{background:#151a22;color:var(--text);border:1px solid var(--border);border-radius:9px;padding:12px 0;cursor:pointer;font-size:18px;font-weight:800;min-height:52px}
  .markButtons button.sel{background:var(--accent);color:#07111d;border-color:var(--accent)}
  .cricketMark{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;position:relative;overflow:visible}
  .cricketMark.m0::before{content:"";position:absolute;width:24px;height:3px;background:currentColor;border-radius:2px}
  .cricketMark.m1::before{content:"";position:absolute;width:3px;height:27px;background:currentColor;transform:rotate(45deg);border-radius:2px}
  .cricketMark.m2::before,.cricketMark.m2::after,
  .cricketMark.m3::before,.cricketMark.m3::after{content:"";position:absolute;width:3px;height:29px;background:currentColor;border-radius:2px;z-index:2}
  .cricketMark.m2::before,.cricketMark.m3::before{transform:rotate(45deg)}
  .cricketMark.m2::after,.cricketMark.m3::after{transform:rotate(-45deg)}
  .cricketMark.m3{width:24px;height:24px;border:3px solid currentColor;border-radius:50%;margin:5px;overflow:visible}
  .cricketMark.m3::before,.cricketMark.m3::after{height:34px}

  .roundTotal{text-align:center;font-size:13px;color:var(--muted);margin-top:12px}
  .roundTotal b{color:var(--text);font-size:22px}
  .roundNav{display:grid;grid-template-columns:1fr 1.6fr;gap:8px;margin-top:14px}
  .roundNav button{min-height:50px}

  .history{margin-top:18px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
  th,td{border-bottom:1px solid var(--border);padding:9px 7px;text-align:left;vertical-align:top}
  th{color:var(--muted);font-weight:600}
  .note{color:var(--muted);font-size:13px;line-height:1.55}
  .rowActions{display:flex;gap:6px;align-items:center;white-space:nowrap}
  .editBtn,.deleteRowBtn{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:var(--panel2);color:var(--text);border:1px solid var(--border);cursor:pointer}
  .deleteRowBtn{background:#3a2023;color:#ffd7d7;border-color:#553034}
  .editBtn svg,.deleteRowBtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .modalBackdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;padding:18px;overflow:auto}
  .modalBackdrop.show{display:flex;align-items:center;justify-content:center}
  .modal{width:min(520px,100%);max-height:calc(100vh - 36px);overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 18px 60px rgba(0,0,0,.45)}
  .modalHeader{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .modalHeader h3{margin:0;font-size:19px}
  .closeBtn{width:38px;height:38px;border-radius:9px;background:var(--panel2);color:var(--text);border:1px solid var(--border);cursor:pointer;font-size:20px}
  .editRounds{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:6px}
  .editRoundToggle{border:1px solid var(--border);background:var(--panel2);color:var(--muted);padding:10px 6px;border-radius:8px;font-weight:750;cursor:pointer}
  .editRoundToggle.active{background:var(--warning);border-color:var(--warning);color:var(--warningInk)}
  .editMpr{background:#111722;border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:12px;color:var(--muted)}
  .editMpr b{float:right;color:var(--good);font-size:20px}
  button:disabled{cursor:default}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#eef2f7;color:#10151b;padding:10px 14px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:80}
  .toast.show{opacity:1}

  /* Landscape-first layout for the DARTSLIVE card-slot placement. */
  @media (orientation:landscape) and (max-height:650px){
    body{min-height:100dvh}
    header{max-width:none;padding:6px max(12px,env(safe-area-inset-right)) 2px max(12px,env(safe-area-inset-left))}
    h1{font-size:17px;line-height:1.15}
    main{max-width:none;padding:4px max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
    .tab{padding:7px 10px;border-radius:8px;min-height:36px}
    section{padding:10px;border-radius:12px}
    section>h2{display:none}
    label{font-size:11px;margin-bottom:4px}
    input,select{padding:8px 9px;font-size:15px}

    /* COUNT-UP: full-width landscape scoring layout. */
    #countup.active{display:grid;grid-template-columns:1fr;align-items:start}
    #countup>.grid{grid-column:1;grid-row:1;grid-template-columns:minmax(140px,.7fr) minmax(280px,1.3fr);gap:8px}
    #countup>label{grid-column:1;grid-row:2;margin-top:8px!important}
    #countup>.rounds{grid-column:1;grid-row:3;margin-top:0;grid-template-columns:repeat(8,1fr);gap:5px}
    .noBullToggle{padding:9px 3px;font-size:13px;border-radius:8px}
    #countup>.actions{grid-column:1;grid-row:4;display:grid;grid-template-columns:1.6fr 1fr;gap:7px;margin-top:8px}
    #countup>.actions button{min-height:42px}
    .bullBox{grid-template-columns:1fr 82px 62px;gap:6px}
    .bullBtn,.bullMinus{height:42px}

    /* CRICKET: setup stays narrow on the left; throwing controls use the wide area. */
    #cricket.active{display:grid;grid-template-columns:170px minmax(0,1fr);grid-template-areas:"setup play" "actions play";gap:8px 10px;align-items:start}
    #cricket>.grid{grid-area:setup;grid-template-columns:1fr;gap:7px}
    #cricket>.cricketPlay{grid-area:play;margin-top:0;min-width:0}
    #cricket>.actions{grid-area:actions;margin-top:0;align-self:end}
    #cricket>.actions button{width:100%;min-height:40px}
    .roundStatus{padding:7px 10px;margin-bottom:7px;border-radius:10px}
    .roundCurrent{font-size:25px}
    .roundMax{font-size:13px}
    .roundTarget{font-size:10px;margin-top:3px}
    .mprPanel{min-width:100px}
    .mprLabel{font-size:9px}
    .mprValue{font-size:27px}
    .marksMini{font-size:9px;margin-top:3px}
    .marksMini b{font-size:12px}
    .currentDarts{grid-template-columns:repeat(3,1fr);gap:6px}
    .currentDart{padding:6px;border-radius:10px}
    .dartTitle{font-size:10px;margin-bottom:4px}
    .markButtons{grid-template-columns:repeat(4,1fr);gap:4px}
    .markButtons button{padding:4px 0;min-height:43px;font-size:15px;border-radius:8px}
    .cricketMark{transform:scale(.82)}
    .roundTotal{font-size:10px;margin-top:5px}
    .roundTotal b{font-size:17px}
    .roundNav{grid-template-columns:1fr 2fr;gap:6px;margin-top:6px}
    .roundNav button{min-height:42px;padding:7px 10px}

    /* HISTORY: use the horizontal space rather than forcing a narrow mobile table. */
    #history.active{padding-top:9px}
    #history .iconActions{gap:6px}
    #history .iconBtn{width:40px;height:40px}
    #history .history{margin-top:8px;max-height:calc(100dvh - 115px);overflow:auto}
    #history table{min-width:680px;font-size:12px}
    #history th,#history td{padding:6px}
    .editBtn,.deleteRowBtn{width:34px;height:34px}

    .toast{bottom:max(10px,env(safe-area-inset-bottom));padding:7px 12px;font-size:12px}
  }

  @media(max-width:620px) and (orientation:portrait){
    header{padding-left:14px;padding-right:14px}
    main{padding-left:12px;padding-right:12px}
    section{padding:14px}
    .bullBox{grid-template-columns:1fr 82px 60px}
    .bullBtn,.bullMinus{height:52px}
    .rounds{grid-template-columns:repeat(4,1fr)}
    .currentDarts{grid-template-columns:1fr}
    .markButtons{grid-template-columns:repeat(4,1fr)}
    .markButtons button{padding:14px 0}
    .roundCurrent{font-size:32px}
    .mprValue{font-size:31px}
    .modalBackdrop{padding:10px}
  }
</style>
</head>
<body>
<header>
  <h1>Darts Practice Log</h1>
</header>

<main>
  <div class="tabs">
    <button class="tab active" data-tab="countup">COUNT-UP</button>
    <button class="tab" data-tab="cricket">CRICKET</button>
    <button class="tab" data-tab="history">HISTORY</button>
  </div>

  <section id="countup" class="active">
    <h2>COUNT-UP</h2>

    <div class="grid">
      <div>
        <label>SCORE</label>
        <input id="cuScore" type="number" min="0" placeholder="e.g. 455">
      </div>

      <div>
        <label>BULLS</label>
        <div class="bullBox">
          <input id="cuBull" type="number" min="0" max="24" value="0" inputmode="numeric">
          <button class="bullBtn" id="bullPlus" type="button">＋1</button>
          <button class="bullMinus" id="bullMinus" type="button">−1</button>
        </div>
      </div>
    </div>

    <label style="margin-top:16px">NO BULL ROUNDS</label>
    <div class="rounds" id="cuRounds"></div>

    <div class="actions">
      <button class="primary" id="saveCU">RECORD GAME</button>
      <button class="secondary" id="clearCU">CLEAR</button>
    </div>

  </section>

  <section id="cricket">
    <h2>CRICKET</h2>
    <div class="grid">
      <div>
        <label>TARGET NUMBER</label>
        <select id="targetNum">
          <option>20</option><option>19</option><option>18</option>
          <option>17</option><option>16</option><option>15</option><option>BULL</option>
        </select>
      </div>
      <div>
        <label>ROUNDS</label>
        <select id="roundCount">
          <option value="15">15R</option>
          <option value="20">20R</option>
        </select>
      </div>
    </div>

    <div class="cricketPlay">
      <div class="roundStatus">
        <div>
          <div class="roundNow">
            <span class="roundCurrent" id="roundCurrent">R1</span>
            <span class="roundMax" id="roundMax">/ 15</span>
          </div>
          <div class="roundTarget" id="roundTarget">TARGET 20</div>
        </div>
        <div class="mprPanel">
          <div class="mprLabel">CURRENT MPR</div>
          <div class="mprValue" id="mpr">0.00</div>
          <div class="marksMini">TOTAL MARKS <b id="markTotal">0</b></div>
        </div>
      </div>

      <div class="currentDarts" id="currentDarts"></div>
      <div class="roundTotal">ROUND MARKS <b id="roundMarkTotal">0</b></div>

      <div class="roundNav">
        <button class="secondary" id="prevRound">← PREVIOUS</button>
        <button class="primary" id="nextRound">NEXT →</button>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="secondary" id="clearCR">CLEAR</button>
    </div>
  </section>

  <section id="history">
    <h2>HISTORY</h2>
    <div class="iconActions">
      <button class="iconBtn shareIcon" id="shareToday" title="Send to Analysis Chat" aria-label="Send to Analysis Chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13a5 5 0 0 1-5 5H8l-5 3V7a4 4 0 0 1 4-4h6"></path><path d="M15 3h6v6"></path><path d="m21 3-8 8"></path></svg>
      </button>
      <button class="iconBtn" id="copyToday" title="Copy" aria-label="Copy">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"></path></svg>
      </button>
      <button class="iconBtn" id="exportCsv" title="Export CSV" aria-label="Export CSV">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17V5"></path><path d="m7 10 5-5 5 5"></path><path d="M5 19v2h14v-2"></path></svg>
      </button>
      <button class="iconBtn dangerIcon" id="deleteAll" title="Delete All" aria-label="Delete All">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="m19 6-1 15H6L5 6"></path><path d="M10 11v6M14 11v6"></path></svg>
      </button>
    </div>

    <div class="history">
      <table>
        <thead><tr><th>DATE</th><th>TYPE</th><th>DETAILS</th><th></th></tr></thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </section>
</main>

<div id="toast" class="toast"></div>

<div id="editModal" class="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="editTitle">
  <div class="modal">
    <div class="modalHeader">
      <h3 id="editTitle">EDIT RECORD</h3>
      <button type="button" class="closeBtn" id="closeEdit" aria-label="Close">×</button>
    </div>
    <div id="editFields"></div>
    <div class="actions">
      <button type="button" class="primary" id="saveEdit">SAVE</button>
      <button type="button" class="secondary" id="cancelEdit">CANCEL</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const KEY = "dartsPracticeLog_v2";
const ANALYSIS_CHAT_URL_KEY = "dartsPracticeAnalysisChatUrl_v1";
const DEFAULT_ANALYSIS_CHAT_URL = "https://chatgpt.com/g/g-p-6a7c1c5285f88191833678d7e4694fd3/c/6a8178b5-e358-83ee-aed2-3e16db80db29";

function toast(msg){
  const t=$("#toast");
  t.textContent=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1600);
}
function haptic(ms=50){
  try{
    if(typeof navigator.vibrate === 'function'){
      // Short but clearly perceptible pulse. Returns false on unsupported/blocked devices.
      return navigator.vibrate(Math.max(40, ms));
    }
  }catch{}
  return false;
}
function loadLogs(){
  try{
    const newer=JSON.parse(localStorage.getItem(KEY)||"null");
    if(newer) return newer;
    return JSON.parse(localStorage.getItem("dartsPracticeLog_v1")||"[]");
  }catch{return []}
}
function saveLogs(v){ localStorage.setItem(KEY, JSON.stringify(v)); }

$$('.tab').forEach(b=>b.onclick=()=>{
  $$('.tab').forEach(x=>x.classList.remove('active'));
  $$('section').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  $('#'+b.dataset.tab).classList.add('active');
  if(b.dataset.tab==='history') renderHistory();
});

// COUNT-UP: tap-to-toggle No Bull rounds.
for(let i=1;i<=8;i++){
  const btn=document.createElement('button');
  btn.type='button';
  btn.className='noBullToggle';
  btn.dataset.round=String(i);
  btn.setAttribute('aria-pressed','false');
  btn.textContent=`R${i}`;
  btn.onclick=()=>{
    haptic();
    const active=btn.classList.toggle('active');
    btn.setAttribute('aria-pressed',String(active));
  };
  $('#cuRounds').appendChild(btn);
}


$('#bullPlus').onclick=()=>{
  haptic();
  $('#cuBull').value=Math.min(24, Number($('#cuBull').value||0)+1);
};
$('#bullMinus').onclick=()=>{
  haptic();
  $('#cuBull').value=Math.max(0, Number($('#cuBull').value||0)-1);
};

function clearCU(){
  $('#cuScore').value='';
  $('#cuBull').value='0';
  $$('.noBullToggle').forEach(x=>{
    x.classList.remove('active');
    x.setAttribute('aria-pressed','false');
  });
}

$('#saveCU').onclick=()=>{
  haptic(70);
  if($('#cuScore').value===''){alert('Enter a score first.');return;}
  const score=Number($('#cuScore').value);
  const bull=Number($('#cuBull').value||0);
  const noBull=$$('.noBullToggle.active').map(x=>Number(x.dataset.round));

  const logs=loadLogs();
  logs.unshift({
    ts:new Date().toISOString(),
    type:'COUNT-UP',
    score,bull,noBull
  });
  saveLogs(logs);

  clearCU();
  toast('COUNT-UP recorded.');
};

$('#clearCU').onclick=()=>{ haptic(); clearCU(); };

let cricket = [];
let currentRound = 0;

function newCricketSession(){
  const rounds=Number($('#roundCount').value);
  cricket=Array.from({length:rounds},()=>[null,null,null]);
  currentRound=0;
  renderCurrentRound();
}

function renderCurrentRound(){
  const rounds=cricket.length;
  currentRound=Math.max(0,Math.min(currentRound,rounds-1));

  $('#roundCurrent').textContent=`R${currentRound+1}`;
  $('#roundMax').textContent=`/ ${rounds}`;
  $('#roundTarget').textContent=`TARGET ${$('#targetNum').value}`;

  const wrap=$('#currentDarts');
  wrap.innerHTML='';

  for(let dart=0; dart<3; dart++){
    const box=document.createElement('div');
    box.className='currentDart';

    const title=document.createElement('div');
    title.className='dartTitle';
    title.textContent=`DART ${dart+1}`;
    box.appendChild(title);

    const buttons=document.createElement('div');
    buttons.className='markButtons';

    [0,1,2,3].forEach(mark=>{
      const btn=document.createElement('button');
      btn.type='button';
      btn.title=`${mark} mark`;
      btn.setAttribute('aria-label',`${mark} mark`);
      const markIcon=document.createElement('span');
      markIcon.className=`cricketMark m${mark}`;
      btn.appendChild(markIcon);

      if(cricket[currentRound][dart]===mark) btn.classList.add('sel');

      btn.onclick=()=>{
        haptic();
        cricket[currentRound][dart]=mark;
        renderCurrentRound();
      };

      buttons.appendChild(btn);
    });

    box.appendChild(buttons);
    wrap.appendChild(box);
  }

  updateCricket();

  $('#prevRound').disabled=currentRound===0;
  $('#prevRound').style.opacity=currentRound===0?'.45':'1';

  if(currentRound===rounds-1){
    $('#nextRound').textContent='RECORD GAME';
  }else{
    $('#nextRound').textContent='NEXT →';
  }
}

function updateCricket(){
  const enteredRounds=cricket.filter(r=>r.every(v=>v!==null));
  const enteredValues=cricket.flat().filter(v=>v!==null);
  const total=enteredValues.reduce((a,b)=>a+b,0);
  const roundTotal=cricket[currentRound]
    .filter(v=>v!==null)
    .reduce((a,b)=>a+b,0);

  $('#markTotal').textContent=total;
  $('#mpr').textContent=enteredRounds.length ? (total/enteredRounds.length).toFixed(2) : '0.00';
  $('#roundMarkTotal').textContent=roundTotal;
}

$('#targetNum').onchange=()=>renderCurrentRound();
$('#roundCount').onchange=newCricketSession;
function clearCricket(){
  cricket=Array.from({length:Number($('#roundCount').value)},()=>[null,null,null]);
  currentRound=0;
  renderCurrentRound();
}

$('#clearCR').onclick=()=>{
  haptic();
  clearCricket();
};

$('#prevRound').onclick=()=>{
  haptic();
  if(currentRound>0){
    currentRound--;
    renderCurrentRound();
  }
};

function saveCricketGame(){
  const completed=cricket.filter(r=>r.every(v=>v!==null)).length;
  if(completed!==cricket.length){
    alert(`${cricket.length-completed} round(s) are still incomplete.`);
    return false;
  }

  const total=cricket.flat().reduce((a,b)=>a+b,0);
  const hit=cricket.flat().filter(x=>x>0).length;
  const rounds=cricket.length;

  const logs=loadLogs();
  logs.unshift({
    ts:new Date().toISOString(),
    type:'CRICKET',
    target:$('#targetNum').value,
    rounds,
    marks:total,
    mpr:Number((total/rounds).toFixed(2)),
    hitDarts:hit,
    darts:cricket
  });
  saveLogs(logs);

  newCricketSession();
  toast('CRICKET recorded.');
  return true;
}

$('#nextRound').onclick=()=>{
  haptic();
  if(!cricket[currentRound].every(v=>v!==null)){
    toast('Enter all 3 darts first.');
    return;
  }

  if(currentRound<cricket.length-1){
    currentRound++;
    renderCurrentRound();
  }else{
    saveCricketGame();
  }
};


function fmtDate(iso){
  return new Intl.DateTimeFormat('ja-JP',{
    year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit'
  }).format(new Date(iso));
}
function localDayKey(date){
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}
function todayLogs(){
  const today=localDayKey(new Date());
  return loadLogs().filter(x=>localDayKey(new Date(x.ts))===today).reverse();
}
function makeShareText(){
  const items=todayLogs();
  const date=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());

  if(!items.length) return `${date} Darts Practice Log\nNo records`;

  const cu=items.filter(x=>x.type==='COUNT-UP');
  const cr=items.filter(x=>x.type==='CRICKET');

  let lines=[`${date} Darts Practice Log`];

  if(cu.length){
    lines.push('');
    lines.push('[COUNT-UP]');
    cu.forEach((x,i)=>{
      const rounds=x.noBull?.length ? x.noBull.join('') : '-';
      lines.push(`${i+1}. ${x.score}/${x.bull}/${rounds}`);
    });

    const avgScore=cu.reduce((s,x)=>s+x.score,0)/cu.length;
    const avgBull=cu.reduce((s,x)=>s+x.bull,0)/cu.length;
    const avgNo=cu.reduce((s,x)=>s+(x.noBull?.length||0),0)/cu.length;
    lines.push(`AVG: ${avgScore.toFixed(1)} / BULL ${avgBull.toFixed(1)} / NO BULL ${avgNo.toFixed(1)}R`);
  }

  if(cr.length){
    lines.push('');
    lines.push('[CRICKET]');
    cr.forEach((x,i)=>lines.push(`${i+1}. ${x.target}/${x.marks} (${Number(x.mpr).toFixed(2)} MPR)`));

    const groups={};
    cr.forEach(x=>{
      if(!groups[x.target]) groups[x.target]=[];
      groups[x.target].push(x);
    });
    Object.entries(groups).forEach(([target,arr])=>{
      const totalMarks=arr.reduce((s,x)=>s+x.marks,0);
      const totalRounds=arr.reduce((s,x)=>s+x.rounds,0);
      lines.push(`${target} AVG: ${(totalMarks/totalRounds).toFixed(2)} MPR`);
    });
  }

  return lines.join('\n');
}

async function copyText(text,{showToast=true}={}){
  try{
    await navigator.clipboard.writeText(text);
  }catch{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.setAttribute('readonly','');
    ta.style.position='fixed';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  if(showToast) toast('Copied.');
}

async function copyShare(){
  haptic();
  await copyText(makeShareText());
}

function isValidAnalysisChatUrl(value){
  try{
    const u=new URL(value);
    return u.protocol==='https:' && u.hostname==='chatgpt.com' && u.pathname.includes('/c/');
  }catch{return false}
}

function configureAnalysisChat(){
  const current=localStorage.getItem(ANALYSIS_CHAT_URL_KEY)||'';
  const value=prompt('Paste the ChatGPT analysis chat URL.',current);
  if(value===null) return null;
  const trimmed=value.trim();
  if(!isValidAnalysisChatUrl(trimmed)){
    alert('Please enter a valid chatgpt.com conversation URL.');
    return null;
  }
  localStorage.setItem(ANALYSIS_CHAT_URL_KEY,trimmed);
  toast('Analysis chat saved.');
  return trimmed;
}

function androidChromeIntent(url){
  try{
    const u=new URL(url);
    const target=`${u.host}${u.pathname}${u.search}${u.hash}`;
    return `intent://${target}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(url)};end`;
  }catch{
    return url;
  }
}

async function sendToAnalysisChat(){
  haptic();
  const chatUrl=DEFAULT_ANALYSIS_CHAT_URL;

  const text=makeShareText();
  const copyPromise=copyText(text,{showToast:false});

  // On Android, a normal https link can be intercepted by the native ChatGPT app.
  // Force this specific conversation URL through Chrome so the full /c/... path is kept.
  if(/Android/i.test(navigator.userAgent)){
    window.location.href=androidChromeIntent(chatUrl);
  }else{
    const opened=window.open(chatUrl,'_blank','noopener,noreferrer');
    if(!opened) window.location.href=chatUrl;
  }

  try{
    await copyPromise;
  }catch{}
}

$('#copyToday').onclick=copyShare;

const shareBtn=$('#shareToday');
shareBtn.onclick=sendToAnalysisChat;

function renderHistory(){
  const body=$('#historyBody');
  body.innerHTML='';

  const logs=loadLogs();
  if(!logs.length){
    const tr=document.createElement('tr');
    tr.innerHTML='<td colspan="4" style="color:var(--muted)">NO RECORDS</td>';
    body.appendChild(tr);
    return;
  }

  logs.forEach((x,index)=>{
    const tr=document.createElement('tr');
    let detail='';

    if(x.type==='COUNT-UP'){
      detail=`${x.score} / BULL ${x.bull} / NO BULL R ${x.noBull?.length?x.noBull.join(','):'-'}`;
    }else{
      detail=`TARGET ${x.target} / ${x.marks} MARKS / ${Number(x.mpr).toFixed(2)} MPR / ${x.rounds}R`;
    }

    tr.innerHTML=`<td>${fmtDate(x.ts)}</td><td>${x.type}</td><td>${detail}</td><td><div class="rowActions"><button type="button" class="editBtn" data-edit="${index}" title="Edit" aria-label="Edit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"></path></svg></button><button type="button" class="deleteRowBtn" data-delete="${index}" title="Delete record" aria-label="Delete record"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="m19 6-1 15H6L5 6"></path><path d="M10 11v6M14 11v6"></path></svg></button></div></td>`;
    body.appendChild(tr);
  });

  $$('[data-edit]').forEach(btn=>btn.onclick=()=>openEditRecord(Number(btn.dataset.edit)));
  $$('[data-delete]').forEach(btn=>btn.onclick=()=>deleteHistoryRecord(Number(btn.dataset.delete)));
}

function deleteHistoryRecord(index){
  const logs=loadLogs();
  const item=logs[index];
  if(!item) return;
  const label=item.type==='COUNT-UP'
    ? `COUNT-UP ${item.score}`
    : `CRICKET ${item.target} / ${Number(item.mpr).toFixed(2)} MPR`;
  if(!confirm(`Delete this record?\n${label}`)) return;
  haptic();
  logs.splice(index,1);
  saveLogs(logs);
  renderHistory();
  toast('Record deleted.');
}

let editingIndex=null;
let editNoBull=[];

function closeEditRecord(){
  editingIndex=null;
  $('#editModal').classList.remove('show');
  $('#editFields').innerHTML='';
}

function renderEditCountUp(log){
  editNoBull=[...(log.noBull||[])];
  $('#editFields').innerHTML=`
    <div class="grid">
      <div><label>SCORE</label><input id="editScore" type="number" min="0" value="${Number(log.score)||0}"></div>
      <div><label>BULLS</label><input id="editBull" type="number" min="0" max="24" value="${Number(log.bull)||0}"></div>
    </div>
    <label style="margin-top:14px">NO BULL ROUNDS</label>
    <div class="editRounds" id="editNoBullRounds"></div>`;

  for(let i=1;i<=8;i++){
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='editRoundToggle'+(editNoBull.includes(i)?' active':'');
    btn.textContent=`R${i}`;
    btn.onclick=()=>{
      haptic();
      if(editNoBull.includes(i)) editNoBull=editNoBull.filter(x=>x!==i); else editNoBull.push(i);
      btn.classList.toggle('active');
    };
    $('#editNoBullRounds').appendChild(btn);
  }
}

function renderEditCricket(log){
  const targets=['20','19','18','17','16','15','BULL'];
  $('#editFields').innerHTML=`
    <div class="grid">
      <div><label>TARGET NUMBER</label><select id="editTarget">${targets.map(x=>`<option ${String(log.target)===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div><label>ROUNDS</label><select id="editRounds"><option value="15" ${Number(log.rounds)===15?'selected':''}>15R</option><option value="20" ${Number(log.rounds)===20?'selected':''}>20R</option></select></div>
      <div><label>MARKS</label><input id="editMarks" type="number" min="0" value="${Number(log.marks)||0}"></div>
    </div>
    <div class="editMpr">MPR <b id="editMpr">0.00</b></div>`;
  const calc=()=>{
    const rounds=Math.max(1,Number($('#editRounds').value)||1);
    const marks=Math.max(0,Number($('#editMarks').value)||0);
    $('#editMpr').textContent=(marks/rounds).toFixed(2);
  };
  $('#editRounds').addEventListener('change',calc);
  $('#editMarks').addEventListener('input',calc);
  calc();
}

function openEditRecord(index){
  const logs=loadLogs();
  const log=logs[index];
  if(!log) return;
  haptic();
  editingIndex=index;
  $('#editTitle').textContent=`EDIT ${log.type}`;
  if(log.type==='COUNT-UP') renderEditCountUp(log); else renderEditCricket(log);
  $('#editModal').classList.add('show');
}

$('#closeEdit').onclick=closeEditRecord;
$('#cancelEdit').onclick=closeEditRecord;
$('#editModal').addEventListener('click',e=>{ if(e.target===$('#editModal')) closeEditRecord(); });

$('#saveEdit').onclick=()=>{
  if(editingIndex===null) return;
  const logs=loadLogs();
  const old=logs[editingIndex];
  if(!old) return closeEditRecord();

  if(old.type==='COUNT-UP'){
    const score=Number($('#editScore').value);
    const bull=Number($('#editBull').value);
    if(!Number.isFinite(score) || score<0 || !Number.isFinite(bull) || bull<0 || bull>24){
      alert('Check SCORE and BULLS.');
      return;
    }
    old.score=score;
    old.bull=bull;
    old.noBull=[...editNoBull].sort((a,b)=>a-b);
  }else{
    const rounds=Number($('#editRounds').value);
    const marks=Number($('#editMarks').value);
    if(!Number.isFinite(rounds) || rounds<=0 || !Number.isFinite(marks) || marks<0){
      alert('Check ROUNDS and MARKS.');
      return;
    }
    const summaryChanged=rounds!==Number(old.rounds) || marks!==Number(old.marks);
    old.target=$('#editTarget').value;
    old.rounds=rounds;
    old.marks=marks;
    old.mpr=Number((marks/rounds).toFixed(2));
    if(summaryChanged){ delete old.darts; delete old.hitDarts; }
  }

  saveLogs(logs);
  haptic(70);
  closeEditRecord();
  renderHistory();
  toast('Record updated.');
};

$('#deleteAll').onclick=()=>{
  if(confirm('Delete all saved history?')){
    localStorage.removeItem(KEY);
    localStorage.removeItem('dartsPracticeLog_v1');
    renderHistory();
    toast('History deleted.');
  }
};

$('#exportCsv').onclick=()=>{
  haptic();
  const rows=[['DATE','TYPE','DETAILS']];

  loadLogs().forEach(x=>{
    const detail=x.type==='COUNT-UP'
      ? `${x.score} / BULL ${x.bull} / NO BULL R ${(x.noBull||[]).join(',')}`
      : `TARGET ${x.target} / ${x.marks} MARKS / ${Number(x.mpr).toFixed(2)} MPR / ${x.rounds}R`;

    rows.push([fmtDate(x.ts),x.type,detail]);
  });

  const esc=v=>`"${String(v).replaceAll('"','""')}"`;
  const csv='\uFEFF'+rows.map(r=>r.map(esc).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='darts_practice_log.csv';
  a.click();
  URL.revokeObjectURL(a.href);
};

// Prefer landscape while the installed PWA is in use. The manifest is the
// primary setting; Screen Orientation is a best-effort reinforcement.
async function requestLandscape(){
  try{
    if(screen.orientation && typeof screen.orientation.lock==='function'){
      await screen.orientation.lock('landscape');
    }
  }catch{
    // Some browsers allow orientation locking only for installed/fullscreen PWAs.
  }
}

// Keep the screen awake while the app is being used (when supported).
let wakeLock = null;
async function requestWakeLock(){
  if(!('wakeLock' in navigator) || document.visibilityState!=='visible' || wakeLock) return;
  try{
    wakeLock=await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release',()=>{ wakeLock=null; });
  }catch{
    wakeLock=null;
  }
}

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    requestWakeLock();
    requestLandscape();
  }
});
document.addEventListener('pointerdown',()=>{
  requestWakeLock();
  requestLandscape();
},{passive:true});

newCricketSession();
requestWakeLock();
requestLandscape();

// Keep PWA installation/update support active for new and existing users.
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Service worker registration failed:',err));
  });
}
